services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cholo_coach
      POSTGRES_USER: cholo_coach
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Configura LOCAL_POSTGRES_PASSWORD para la base local}
    volumes:
      - cholo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cholo_coach -d cholo_coach"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cholo_postgres:
