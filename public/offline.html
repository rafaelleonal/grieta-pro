<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12151d" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión · Elociencia</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #12151d;
        color: #eef2fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      .brand {
        color: #a9b2c8;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 48px;
      }
      .badge {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #202e57;
        color: #87a9ff;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(30px, 8vw, 40px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        margin: 0 0 18px;
      }
      p {
        color: #a9b2c8;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 16px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 14px 22px;
        margin: 16px 0 24px;
        border-radius: 10px;
        background: #4b7cf3;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #608cf7;
      }
      a:focus-visible {
        outline: 3px solid #a9c1ff;
        outline-offset: 4px;
      }
      .note {
        font-size: 13px;
        color: #808ba4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Elociencia · League of Legends</p>
      <div class="badge" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="m2 2 20 20M8.5 8.5a6 6 0 0 1 8.5 0M5 5a10 10 0 0 1 15 0M2 8a14 14 0 0 1 2-2M8.5 12.5a5 5 0 0 1 3.5-1.5M12 16h.01"
          />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>Conéctate para analizar tu partida.</p>
      <a href="/">Reintentar</a>
      <p class="note">Tus fotos, claves y planes no se guardan en caché.</p>
    </main>
  </body>
</html>
