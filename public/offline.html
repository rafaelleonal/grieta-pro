<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161826" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión · Elociencia</title>
    <style>
      /* Página estática precacheada: no depende de la hoja de Tailwind ni de fuentes remotas. */
      :root {
        color-scheme: dark;
        --bg: #161826;
        --surface: #232532;
        --text: #e9e9ed;
        --n300: #cfd3e5;
        --n400: #b2b6ca;
        --n500: #9397ab;
        --divider: rgba(233, 233, 237, 0.14);
        --accent: #9184d9;
        --a200: #e7e5fe;
        --a300: #d2cefd;
        --a900: #2b2741;
        --lime: #c6f36b;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .word {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .word span {
        color: var(--lime);
      }
      .mascot {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: var(--lime);
        overflow: hidden;
      }
      .mascot img {
        width: 92%;
        height: 92%;
        object-fit: contain;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--surface);
        color: var(--n300);
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .status svg {
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--n400);
        max-width: 34ch;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 52px;
        padding: 0 20px;
        border: 1px solid var(--accent);
        border-radius: 12px;
        background: var(--a900);
        color: var(--a200);
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 120ms;
      }
      a:hover {
        background: #353050;
      }
      a:focus-visible {
        outline: 2px solid var(--a300);
        outline-offset: 2px;
      }
      .note {
        padding-top: 16px;
        border-top: 1px solid var(--divider);
        color: var(--n500);
        font-size: 13px;
        max-width: none;
        width: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="word" aria-label="Elociencia"><span>elo</span>ciencia</p>
      <div class="mascot">
        <img src="/brand/mascota-lima-256.png" alt="" width="104" height="104" />
      </div>
      <span class="status">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="m2 2 20 20M8.5 8.5a6 6 0 0 1 8.5 0M5 5a10 10 0 0 1 15 0M2 8a14 14 0 0 1 2-2M8.5 12.5a5 5 0 0 1 3.5-1.5M12 16h.01"
          />
        </svg>
        Sin conexión
      </span>
      <h1>Vuelve a conectarte</h1>
      <p>Necesitas internet para preparar tu partida y consultar tus planes.</p>
      <a href="/">Reintentar</a>
      <p class="note">Tus fotos, claves y planes no se guardan en este dispositivo.</p>
    </main>
  </body>
</html>
