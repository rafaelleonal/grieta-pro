<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elociencia · imagen social</title>
<style>
@font-face{font-family:Inter;src:url("../../../app/fonts/InterVariable.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(80% 100% at 80% 50%,#2b2741 0,#161826 65%);color:#ecebf5;font-family:Inter,system-ui,sans-serif;position:relative}
.disc{position:absolute;right:70px;top:95px;width:440px;height:440px;border-radius:50%;background:#c6f36b;box-shadow:0 30px 80px rgba(198,243,107,.18)}
.mascot{position:absolute;right:40px;top:70px;width:500px;height:500px}
.left{position:absolute;left:80px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.tag{font-size:36px;font-weight:500;letter-spacing:-.02em;color:#cfd3e5}
.tiles{display:flex;gap:12px}
.t{width:76px;height:76px;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;box-sizing:border-box;font-size:12px}
.t b{font-size:28px;font-weight:600;text-align:center;line-height:1}
.foot{position:absolute;left:80px;right:80px;bottom:34px;display:flex;justify-content:space-between;font-size:17px;color:#9397ab}
</style>
</head>
<body>
<span class="disc"></span>
<img class="mascot" src="../mascota/mascota-1024.png" alt="">
<div class="left">
  <img src="../svg/word.svg" alt="elociencia" style="width:560px">
  <div class="tag">La ciencia de subir de elo.</div>
  <div class="tiles">
    <span class="t" style="background:#24211f;box-shadow:inset 0 0 0 2px #8a7f76;color:#d6ccc3"><span>26</span><b>Fe</b><span></span></span>
    <span class="t" style="background:#23272d;box-shadow:inset 0 0 0 2px #a9b3bf;color:#e2e7ee"><span>47</span><b>Ag</b><span></span></span>
    <span class="t" style="background:#2a2516;box-shadow:inset 0 0 0 2px #c9a85a;color:#f1dca6"><span>79</span><b>Au</b><span></span></span>
    <span class="t" style="background:#17292a;box-shadow:inset 0 0 0 2px #6fb8ac;color:#c4ebe4"><span>78</span><b>Pt</b><span></span></span>
    <span class="t" style="background:#1c2338;box-shadow:inset 0 0 0 2px #7d9ce0;color:#d0dcf7"><span>6</span><b>C</b><span></span></span>
  </div>
</div>
<div class="foot"><span>Coach de League of Legends en español</span><span>No avalado por Riot Games</span></div>
</body>
</html>
