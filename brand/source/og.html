<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>No Era el Jungla · imagen social</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../app/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: radial-gradient(70% 90% at 22% 40%, #2b2741 0, #161826 70%);
        color: #e9e9ed;
        font-family: Inter, system-ui, sans-serif;
        position: relative;
      }
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(145, 132, 217, 0.22);
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 44px;
        margin-top: auto;
        margin-bottom: auto;
      }
      .over {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.2em;
        color: #b2b6ca;
      }
      h1 {
        margin: 4px 0 0;
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      h1 span {
        color: #b5abfc;
      }
      p {
        margin: 22px 0 0;
        font-size: 30px;
        color: #cfd3e5;
        letter-spacing: -0.01em;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .chip {
        height: 48px;
        padding: 0 20px;
        border-radius: 24px;
        box-shadow: inset 0 0 0 1.5px #423a6a;
        background: rgba(43, 39, 65, 0.6);
        display: flex;
        align-items: center;
        font-size: 20px;
        color: #e7e5fe;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        font-size: 17px;
        color: #9397ab;
      }
    </style>
  </head>
  <body>
    <span class="ring" style="width: 620px; height: 620px; left: -170px; top: -20px"></span>
    <span
      class="ring"
      style="width: 420px; height: 420px; left: -70px; top: 80px; border-style: dashed"
    ></span>
    <div class="wrap">
      <div class="row">
        <svg
          width="230"
          height="230"
          viewBox="0 0 64 64"
          aria-hidden="true"
          style="flex: none; filter: drop-shadow(0 18px 40px rgba(145, 132, 217, 0.35))"
        >
          <defs>
            <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
              <rect width="64" height="64" fill="#fff" />
              <path d="M18 46 45 19" stroke="#000" stroke-width="2.2" stroke-linecap="round" />
              <path d="M15 15 49 49" stroke="#000" stroke-width="8.5" stroke-linecap="round" />
            </mask>
          </defs>
          <path d="M14 50C14 30 30 14 50 14 50 34 34 50 14 50Z" fill="#9184d9" mask="url(#c)" />
          <path d="M9.5 54.5 14 50" stroke="#9184d9" stroke-width="3" stroke-linecap="round" />
          <path d="M16 16 48 48" stroke="#e7e5fe" stroke-width="3.6" stroke-linecap="round" />
        </svg>
        <div>
          <div class="over">NO ERA EL</div>
          <h1><span>Jungla</span></h1>
          <p>Prepara tu partida antes de buscar culpables.</p>
          <div class="chips">
            <span class="chip">Matchup</span><span class="chip">Niveles 1–6</span
            ><span class="chip">Compras y mapa</span>
          </div>
        </div>
      </div>
      <div class="foot">
        <span>Coach de League of Legends en español</span><span>No avalado por Riot Games</span>
      </div>
    </div>
  </body>
</html>
