name: Validar contribución

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, lint, tipos, pruebas y compilación
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener código sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias fijadas
        run: pnpm install --frozen-lockfile

      - name: Comprobar formato, lint, tipos y pruebas unitarias
        run: pnpm check

      # PostgreSQL temporal y proveedores simulados: sin claves, correos ni gasto de IA.
      - name: Comprobar cuentas, privacidad y cuotas con PostgreSQL real
        run: pnpm test:accounts

      - name: Compilar
        run: pnpm build

      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level=moderate
