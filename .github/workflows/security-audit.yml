name: Auditar todas las dependencias

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoría completa, incluyendo herramientas de desarrollo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias sin ejecutar scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Incluye desarrollo y falla ante avisos moderados o superiores, sin excepciones.
      - name: Mostrar vulnerabilidades de todas las dependencias
        run: pnpm audit --audit-level=moderate
